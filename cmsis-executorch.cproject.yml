#
# The application: a headless runner that loads the embedded .pte and runs one
# inference on the Ethos-U85. The AI layer (generated by create_ai_layer.py)
# brings the ExecuTorch runtime, the operator components and the model data;
# the Board layer brings the board bring-up.
project:
  packs:
    - pack: PyTorch::ExecuTorch@1.5.1
    - pack: ARM::CMSIS

  misc:
    - CPP:
        - -std=gnu++17
        - -Wno-deprecated-declarations
    - for-compiler: GCC
      C:
        - -Wno-psabi
      CPP:
        - -Wno-psabi
      Link:
        - -Wl,-u,_printf_float

  # The Corstone-320 FVP also runs the turret's YOLOv8n and KWS self-tests. GCC only: its
  # linker script puts the 3 MB YOLO program in DDR; the AC6 and Clang builds stay as they were.
  setups:
    - setup: FVP turret self-tests
      for-context: +SSE-320-U85
      for-compiler: GCC
      define:
        - WALDO_FVP_TURRET

  groups:
    - group: App
      files:
        - file: ./src/app_main.cpp
        # EmbeddedModule: ExecuTorch's Module class without the POSIX file
        # loading, so it builds for bare metal (BSD-3-Clause, see
        # src/LICENSE-ExecuTorch).
        - file: ./src/arm_embedded_module.cpp
        - file: ./src/arm_embedded_module.hpp
        # Face detection: BlazeFace on the Ethos-U85 (model/model.py), decoding on the M55:
        # the template's AI layer and the FVP self-test. The turret uses YOLOv8 instead.
        - file: ./src/face_detector.cpp
          not-for-context: +DevKit-E8
        - file: ./src/face_detector.hpp
    # WALDO: turret servos, motion and tracking. Hardware lives on the DevKit-E8 only.
    - group: WALDO
      for-context: +DevKit-E8
      files:
        - file: ./src/waldo/waldo.cpp
        - file: ./src/waldo/motion.cpp
        - file: ./src/waldo/servo_hw.c
        - file: ./src/waldo/camlink_rx.cpp
        - file: ./src/waldo/tracker.cpp
        - file: ./src/waldo/orchestrator.cpp
        - file: ./src/waldo/view.cpp
        - file: ./src/waldo/face_detect_adapter.cpp
        - file: ./src/waldo/mic.c
        - file: ./src/waldo/brain_hp.cpp
        - file: ./src/waldo/jpeg_frame.c
        - file: ./src/waldo/tjpgd/tjpgd.c
        - file: ./src/waldo/kws_mfcc.c
        - file: ./src/kws.cpp
        - file: ./src/kws_pte.c
        - file: ./src/yolo_detector.cpp
        - file: ./src/yolo_pte.S
          define:
            - YOLO_PTE_PATH: \"$ProjectDir()$/model/yolo/yolo.pte\"

    # fvp-sim: the turret's models and their self-test code on the Corstone-320 FVP.
    - group: FVP-Turret
      for-context: +SSE-320-U85
      for-compiler: GCC
      files:
        - file: ./src/waldo/jpeg_frame.c
        - file: ./src/waldo/tjpgd/tjpgd.c
        - file: ./src/waldo/kws_mfcc.c
        - file: ./src/kws.cpp
        - file: ./src/kws_pte.c
        - file: ./src/yolo_detector.cpp
        - file: ./src/yolo_pte.S
          define:
            - YOLO_PTE_PATH: \"$ProjectDir()$/model/yolo/yolo.pte\"

  layers:
    - layer: $Board-Layer$
      type: Board
    - layer: $AI-Layer$
      type: AI

  output:
    type:
      - elf
      - hex
      - map
